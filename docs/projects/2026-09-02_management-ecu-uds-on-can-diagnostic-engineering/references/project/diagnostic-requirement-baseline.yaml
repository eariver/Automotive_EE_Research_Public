schema_version: "management-ecu-uds-can-diagnostic-project-requirements/v1"
artifact: "Management ECU UDS on CAN diagnostic project requirement baseline"
date: "2026-09-02"
status: "DRAFT_PROJECT_BASELINE"
base_main_sha: "59250354d74100167b80ee40f44e73eb064dd515"

policy:
  - "This file records project diagnostic inputs and unresolved decisions; vendor/AUTOSAR authority does not fill missing project requirements."
  - "CANdela diagnostic specification != Application SWC behavior != DCM != DEM != UDS-on-CAN transport != test result."
  - "Concrete DID/RID/DTC/session/security/NRC/timing values remain TBD until supplied by project authority."

scope:
  protocol: "UDS on CAN"
  excluded: ["DoIP", "OBD-specific workflow", "SAE J1939 diagnostics", "physical ECU/HIL procedure"]

project_requirement_inputs:
  - id: "DIA-IN-001"
    topic: "diagnostic service inventory"
    status: "TBD_PROJECT_DECISION"
    required_content: "Which UDS services/subfunctions are required for Management ECU and their project-visible semantics."
  - id: "DIA-IN-002"
    topic: "DID definitions"
    status: "TBD_PROJECT_DECISION"
    required_content: "DID identifiers, read/write direction, payload/data semantics, conditions and application-data ownership."
  - id: "DIA-IN-003"
    topic: "RoutineControl definitions"
    status: "TBD_PROJECT_DECISION"
    required_content: "Routine identifiers, Start/Stop/RequestResults support, application behavior and preconditions."
  - id: "DIA-IN-004"
    topic: "DTC and diagnostic-event model"
    status: "TBD_PROJECT_DECISION"
    required_content: "DTC identities, event relations, status/persistence expectations and project monitor ownership."
  - id: "DIA-IN-005"
    topic: "diagnostic sessions"
    status: "TBD_PROJECT_DECISION"
    required_content: "Supported sessions, service availability and transition/permission policy."
  - id: "DIA-IN-006"
    topic: "security/access policy"
    status: "TBD_PROJECT_DECISION"
    required_content: "Security levels/access conditions and project mechanism; no algorithm/key material is stored here."
  - id: "DIA-IN-007"
    topic: "NRC/application result policy"
    status: "TBD_PROJECT_DECISION"
    required_content: "Externally visible negative-response policy and ownership mapping between DCM checks and application-side results."
  - id: "DIA-IN-008"
    topic: "UDS timing"
    status: "TBD_PROJECT_DECISION"
    required_content: "P2/P2* and other project diagnostic timing requirements."
  - id: "DIA-IN-009"
    topic: "Application SWC diagnostic responsibility"
    status: "TBD_PROJECT_DECISION"
    required_content: "Which diagnostic elements need Application SWC data/function/monitor behavior and which do not."
  - id: "DIA-IN-010"
    topic: "diagnostic test objectives"
    status: "TBD_PROJECT_DECISION"
    required_content: "Required DiVa/CANoe diagnostic verification scope, expectations and acceptance criteria."

ownership_questions_required_for_each_element:
  - "Is this externally visible diagnostic specification?"
  - "Does it require Application SWC data/function behavior?"
  - "Is service/session/security processing DCM-owned?"
  - "Is event/DTC/fault-memory processing DEM-owned?"
  - "Does it require configured UDS-on-CAN transport?"
  - "What test objective verifies the implemented behavior?"
