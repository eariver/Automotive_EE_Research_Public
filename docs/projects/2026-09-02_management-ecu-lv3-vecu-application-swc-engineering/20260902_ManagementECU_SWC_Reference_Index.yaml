  purpose: >-
    Track the location and authority status of every source, Reviewed Knowledge route,
    project input, and generated project artifact referenced by the Management ECU SWC
    methodology and execution guide.
  authority_policy:
    - This index is navigation/provenance, not independent technical authority.
    - Vendor Reviewed Knowledge remains in its upstream vendor repository; do not copy it into this project folder.
    - Direct AUTOSAR standards authority remains in its independently reviewed standards repository.
    - Project-specific requirements and design choices remain project-specific and are not promoted into canonical docs/knowledge.
  luna_target: >-
    Replace NOT_SPECIFIED_IN_SOURCE external Reviewed Knowledge entries with exact
    downstream routes and exact repository/commit/ref/path/section locators where existing
    reviewed authority supports them.
  status_legend:
    AVAILABLE: File exists in this project repository branch.
    NOT_SPECIFIED_IN_SOURCE: Source methodology names or relies on authority but does not specify exact location.
    TO_BE_DEFINED: Project must define the concrete input or baseline location.
    TO_BE_CREATED: Artifact will be authored during SWC development.
    TO_BE_GENERATED: Derived artifact will be generated by the toolchain.
    COMPILED_EXACT_LOCATORS: Luna compilation has recorded exact-pinned Reviewed Knowledge locators in the allowlisted manifests.

