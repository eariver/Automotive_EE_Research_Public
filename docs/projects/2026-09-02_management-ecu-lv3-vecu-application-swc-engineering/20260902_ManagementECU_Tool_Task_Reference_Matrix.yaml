      - "Do not infer CANape behavior from CANoe/VNT/XCP similarity."
    next_task_ids: []

coverage_summary:
  current_application_swc_navigation:
    status: "READY_AT_WORKFLOW_OBJECT_LEVEL_WITH_EXPLICIT_PROCEDURE_GAPS"
